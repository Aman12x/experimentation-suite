name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.lock
    
    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=modules --cov=utils --cov-report=term --cov-fail-under=80
    
    - name: Run the demo end to end
      run: python demo.py
    
    - name: Lockfiles are in sync with requirements.txt
      run: |
        pip install uv
        uv pip compile requirements.txt --universal --python-version 3.11 -q -o /tmp/requirements.lock --no-header
        python - <<'PY'
        import re
        names = lambda path: {re.split(r'[=<> ;]', l)[0].lower() for l in open(path) if l.strip() and not l.lstrip().startswith('#')}
        missing = names('/tmp/requirements.lock') - names('requirements.lock')
        assert not missing, f'requirements.lock is missing {sorted(missing)}; run make lock'
        PY
    
    - name: Lint with flake8
      run: |
        flake8 modules/ utils/ --max-line-length=100 --count --statistics
      continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build image
      run: docker build -t experimentation-suite .
    
    - name: Default container becomes healthy (Dockerfile HEALTHCHECK)
      run: |
        docker run -d --name ui -p 8501:8501 experimentation-suite
        for i in $(seq 1 40); do
          status=$(docker inspect --format '{{.State.Health.Status}}' ui)
          echo "attempt $i: $status"
          [ "$status" = "healthy" ] && break
          sleep 3
        done
        docker logs ui
        [ "$status" = "healthy" ]
        docker rm -f ui
    
    - name: Compose stack becomes healthy
      run: docker compose up -d --build --wait --wait-timeout 180
    
    - name: Exercise both services over HTTP
      run: |
        curl -fsS http://localhost:8501/_stcore/health
        curl -fsS http://localhost:8000/health
        curl -fsS -X POST http://localhost:8000/api/ab-test/proportions \
          -H "Content-Type: application/json" \
          -d '{"control_success": 50, "control_total": 1000, "treatment_success": 65, "treatment_total": 1000}'
        docker compose exec -T api python demo.py
    
    - name: Logs on failure
      if: failure()
      run: docker compose logs
    
    - name: Tear down
      if: always()
      run: docker compose down


  deploy:
    # Ships to Cloud Run only after the tests and the Docker checks pass on main
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-cloud-run
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write   # keyless auth to Google Cloud, no stored secrets
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/526867948326/locations/global/workloadIdentityPools/github/providers/experimentation-suite
        service_account: github-deployer@experimentation-suite-260917.iam.gserviceaccount.com
    
    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2
    
    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy experimentation-suite \
          --source . \
          --project experimentation-suite-260917 \
          --region us-east4 \
          --port 8501 --memory 1Gi --cpu 1 \
          --min-instances 0 --max-instances 1 \
          --session-affinity --timeout 3600 \
          --allow-unauthenticated --quiet
    
    - name: Verify the live service
      run: |
        URL=$(gcloud run services describe experimentation-suite \
          --project experimentation-suite-260917 --region us-east4 --format='value(status.url)')
        echo "Deployed to $URL"
        curl -fsS --retry 5 --retry-delay 5 "$URL/_stcore/health"
